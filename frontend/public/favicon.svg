<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="worklane-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="card-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="32" height="32" rx="7.5" fill="url(#worklane-bg)"/>
  
  <!-- Subtle inner border for crisp contrast in light & dark browser tabs -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Lane 1 (To Do): Top card + lower card -->
  <rect x="6" y="6.5" width="4.5" height="11" rx="1.5" fill="url(#card-highlight)"/>
  <rect x="6" y="19.5" width="4.5" height="6" rx="1.5" fill="#ffffff" fill-opacity="0.65"/>

  <!-- Lane 2 (In Progress): Shorter top card + active main card -->
  <rect x="13.75" y="6.5" width="4.5" height="6" rx="1.5" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="13.75" y="14.5" width="4.5" height="11" rx="1.5" fill="url(#card-highlight)"/>

  <!-- Lane 3 (Done): Completed card + accent dot -->
  <rect x="21.5" y="6.5" width="4.5" height="15" rx="1.5" fill="url(#card-highlight)"/>
  <circle cx="23.75" cy="24" r="1.5" fill="#38bdf8"/>
</svg>